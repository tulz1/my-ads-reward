<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Ads Reward</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad-index.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>Nonton Iklan Dapat Reward</h2>
    
    <div class="card">
        <p>Saldo Poin Anda:</p>
        <h1 id="balance">0</h1>
        <button onclick="watchAd()">Tonton Iklan (+10 Poin)</button>
    </div>

    <p id="status-msg" style="margin-top: 20px; color: gray;"></p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const AdController = window.Adsgram.init({ 
            blockId: "5c55d9f7b60d483790de6be9c8d90976" 
        });

        let currentBalance = 0;

        function watchAd() {
            const statusText = document.getElementById('status-msg');
            statusText.innerText = "Memuat iklan...";

            AdController.show().then((result) => {
                currentBalance += 10;
                document.getElementById('balance').innerText = currentBalance;
                statusText.innerText = "Selamat! Anda mendapatkan 10 poin.";
            }).catch((error) => {
                statusText.innerText = "Iklan tidak selesai atau gagal dimuat.";
                console.error(error);
            });
        }
    </script>
</body>
</html>
